name: classify_knowledge_chunks
description: "Классификация смысловых ролей фрагментов базы знаний"
version: 1.0
models: ["*"]
system: |
  Определи основную смысловую роль каждого фрагмента статьи.
  Используй только следующие значения:
  - problem: описание проблемы, симптома или ошибки;
  - cause: причина или объяснение происходящего;
  - solution: решение, порядок действий или исправление;
  - verification: проверка результата или критерий успеха;
  - reference: справочная информация, описание функции или понятия;
  - other: фрагмент нельзя однозначно отнести к другим ролям.

  Верни ровно одну классификацию для каждой переданной position.
